<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sight Reading Trainer</title>
<script src="supabase.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Code+Pro:wght@300;400&display=swap');

  :root {
    --bg: #0e0e12;
    --panel: #16161e;
    --panel2: #1d1d28;
    --border: #2a2a3a;
    --accent: #c8a96e;
    --accent2: #7eb8c8;
    --green: #6ec88a;
    --red: #c86e6e;
    --text: #e8e4d8;
    --muted: #7a7870;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Code Pro', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(200,169,110,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(126,184,200,0.06) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ── Auth bar ── */
  .auth-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    min-height: 1.8rem;
  }
  .auth-user { color: var(--accent2); }
  .auth-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    padding: 0.3rem 0.8rem;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .auth-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .auth-btn.signed-in:hover { border-color: var(--red); color: var(--red); }

  .controls {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .toggle-group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    overflow: hidden;
  }

  .toggle-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0.5rem 1.1rem;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    transition: all 0.2s;
    border-right: 1px solid var(--border);
  }
  .toggle-btn:last-child { border-right: none; }
  .toggle-btn.active { background: var(--accent); color: #0e0e12; font-weight: 700; }

  .ctrl-select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    padding: 0.4rem 0.6rem;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    appearance: none;
    -webkit-appearance: none;
  }
  .ctrl-select:focus { outline: none; border-color: var(--accent); }

  .main-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 2.5rem 2.5rem;
    width: 100%;
    max-width: 740px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
  }

  #staff-container { width: 100%; }
  #staff-svg { width: 100%; height: auto; display: block; }

  .note-name-display {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    color: var(--accent);
    min-height: 3.2rem;
    display: flex;
    align-items: center;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }
  .note-name-display.correct { color: var(--green); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .mic-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .mic-dot.active { background: var(--green); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .pitch-display {
    color: var(--accent2);
    font-size: 0.78rem;
    min-width: 150px;
    text-align: center;
  }

  .start-btn {
    background: var(--accent);
    color: #0e0e12;
    border: none;
    border-radius: 6px;
    padding: 0.75rem 2.5rem;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
  }
  .start-btn:hover { opacity: 0.85; }

  .score-display {
    display: flex;
    gap: 2rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .score-display span { color: var(--text); font-size: 1rem; }

  .hint-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    padding: 0.3rem 0.9rem;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .hint-btn:hover { border-color: var(--accent); color: var(--accent); }

  #hint-text {
    color: var(--accent);
    font-size: 0.85rem;
    min-height: 1rem;
    font-family: 'Playfair Display', serif;
  }

  /* ── History panel ── */
  .history-section {
    width: 100%;
    max-width: 740px;
    margin-top: 2rem;
  }

  .history-header {
    margin-bottom: 1rem;
  }

  .history-title {
    font-family: 'Playfair Display', serif;
    color: var(--accent);
    font-size: 1.1rem;
    letter-spacing: 0.05em;
  }

  .tab-bar {
    display: flex;
    margin-bottom: 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    width: fit-content;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0.45rem 1.2rem;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    transition: all 0.2s;
    border-right: 1px solid var(--border);
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn.active { background: var(--accent); color: #0e0e12; font-weight: 700; }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }
  .history-table th {
    text-align: left;
    color: var(--muted);
    letter-spacing: 0.1em;
    font-weight: 400;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
  }
  .history-table td {
    padding: 0.45rem 0.6rem;
    border-bottom: 1px solid #1e1e2a;
    color: var(--text);
  }
  .history-table tr:hover td { background: var(--panel2); }

  .day-block {
    margin-bottom: 1.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .day-header {
    padding: 0.6rem 1rem;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    font-family: 'Playfair Display', serif;
    color: var(--accent);
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }
  .day-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .stat-cell {
    padding: 1rem 1.2rem;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .stat-cell:last-child { border-right: none; }
  .stat-label {
    font-size: 0.63rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--text);
    line-height: 1;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.blue  { color: var(--accent2); }
  .stat-value.gold  { color: var(--accent); }
  .stat-sub {
    font-size: 0.63rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .mode-breakdown { border-top: 1px solid var(--border); }
  .mode-breakdown .history-table th,
  .mode-breakdown .history-table td { padding: 0.3rem 0.9rem; }

  .session-rows { border-top: 1px solid var(--border); }
  .session-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 0.75rem;
    padding: 0.35rem 1rem;
    border-top: 1px solid #1a1a26;
    font-size: 0.7rem;
    color: var(--muted);
    align-items: center;
  }
  .session-row:first-child { border-top: none; }
  .session-row:hover { background: var(--panel2); }

  .pill {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 20px;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
  }
  .pill-good  { background: rgba(110,200,138,0.15); color: var(--green); }
  .pill-total { background: rgba(200,169,110,0.15); color: var(--accent); }
  .pill-blue  { background: rgba(126,184,200,0.15); color: var(--accent2); }
  .pill-slow  { background: rgba(200,110,110,0.15); color: var(--red); }

  .no-history {
    color: var(--muted);
    font-size: 0.78rem;
    padding: 1.5rem 0;
    text-align: center;
    letter-spacing: 0.08em;
  }

  /* ── Mobile: maximise staff size ── */
  @media (max-width: 600px) {
    body { padding: 1rem 0.25rem 3rem; }

    .main-card {
      padding: 0.75rem 0.25rem 1.5rem;
      border-radius: 8px;
      gap: 0.9rem;
    }

    #staff-container { width: 100%; }

    .note-name-display { font-size: 2.2rem; }

    .controls { gap: 0.5rem; }
    .toggle-btn { padding: 0.45rem 0.75rem; font-size: 0.72rem; }

    .history-section { padding: 0 0.25rem; }

    .day-stats { grid-template-columns: repeat(3,1fr); }
    .stat-value { font-size: 1.25rem; }
  }

  #db-error {
    display: none;
    background: rgba(220,60,60,0.15);
    border: 1px solid rgba(220,60,60,0.4);
    color: #e07070;
    border-radius: 6px;
    padding: 0.55rem 0.9rem;
    font-size: 0.78rem;
    margin-bottom: 0.75rem;
    word-break: break-word;
  }
</style>
</head>
<body>

<h1>Sight Reader</h1>
<div class="subtitle">Piano · Pitch Detection · Training Aid</div>

<div class="auth-bar" id="auth-bar" style="display:none">
  <span class="auth-user" id="auth-user"></span>
  <button class="auth-btn" id="auth-btn">Sign in with Google</button>
</div>

<div id="db-error"></div>

<div class="controls">
  <select id="clef-select" class="ctrl-select">
    <option value="treble">Treble</option>
    <option value="bass">Bass</option>
    <option value="both">Both</option>
  </select>
  <select id="notes-select" class="ctrl-select">
    <option value="1">1 Note</option>
    <option value="2">2 Notes</option>
    <option value="3">Triad</option>
  </select>
  <select id="sharps-select" class="ctrl-select">
    <option value="off">No Sharps</option>
    <option value="on">Sharps</option>
  </select>
</div>

<div class="main-card">
  <div id="staff-container">
    <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="note-name-display" id="note-display">—</div>
  <div id="hint-text"></div>

  <div class="status-bar">
    <div class="mic-dot" id="mic-dot"></div>
    <div id="mic-status">Mic off</div>
    <div class="pitch-display" id="pitch-display">—</div>
  </div>

  <button class="start-btn" id="start-btn">Start Listening</button>

  <div class="score-display">
    <div>Correct <span id="score-correct">0</span></div>
    <div>Streak <span id="score-streak">0</span></div>
    <div>Total <span id="score-total">0</span></div>
  </div>

  <button class="hint-btn" id="hint-btn">Show Answer</button>
</div>

<!-- Session History -->
<div class="history-section">
  <div class="history-header">
    <div class="history-title">Practice History</div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="daily">Daily Summary</button>
    <button class="tab-btn" data-tab="sessions">Session Log</button>
    <button class="tab-btn" data-tab="notes">Note Stats</button>
  </div>
  <div id="view-daily"></div>
  <div id="view-sessions" style="display:none"></div>
  <div id="view-notes" style="display:none"></div>
</div>

<script>
// ════════════════════════════════════════════════════════
// SUPABASE CONFIG
// Replace these two values with your project's URL and anon key.
// Leave them as-is to use local storage only (no account required).
// ════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://ewpqefsfcckhslmfqpwb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cHFlZnNmY2NraHNsbWZxcHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MzMxNzYsImV4cCI6MjA4NzAwOTE3Nn0.KWfdAkWT-CNHYAwXg76wVpr4ATCInwFudoRiEAaN5yY';

// db is null when Supabase is not configured; the app falls back to localStorage.
// Custom storage that tries localStorage first and falls back to an
// in-memory map — prevents the Supabase client from hanging when a
// browser (e.g. Edge with Tracking Prevention) blocks its internal
// storage access.
const _mem = {};
const _storage = {
  getItem(k)    { try { return localStorage.getItem(k); }    catch { return _mem[k] ?? null; } },
  setItem(k, v) { try { localStorage.setItem(k, v); }        catch {} _mem[k] = v; },
  removeItem(k) { try { localStorage.removeItem(k); }        catch {} delete _mem[k]; },
};

const db = (typeof window.supabase !== 'undefined' && SUPABASE_URL.startsWith('https://'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        storage:          _storage,
        persistSession:   true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
      },
    })
  : null;

// ════════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════════
let currentUser = null;

function updateAuthUI() {
  const bar    = document.getElementById('auth-bar');
  const userEl = document.getElementById('auth-user');
  const btnEl  = document.getElementById('auth-btn');
  if (!db) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  if (currentUser) {
    userEl.textContent = currentUser.email;
    btnEl.textContent  = 'Sign Out';
    btnEl.classList.add('signed-in');
  } else {
    userEl.textContent = '';
    btnEl.textContent  = 'Sign in with Google';
    btnEl.classList.remove('signed-in');
  }
}

async function signInWithGoogle() {
  if (!db) return;
  await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
}

async function signOut() {
  if (!db) return;
  try {
    await db.auth.signOut();
  } catch (e) {
    console.error('signOut:', e);
    // Force local sign-out even if the network call failed
    currentUser = null;
    updateAuthUI();
  }
}

document.getElementById('auth-btn').addEventListener('click', () => {
  if (currentUser) signOut(); else signInWithGoogle();
});

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let clefMode = 'treble';
let numNotes = 1;
let sharpsOn = false;
let listening = false;
let audioCtx = null, analyser = null, chordAnalyser = null, micStream = null, rafId = null;
let correctCount = 0, streak = 0, total = 0;
let currentNotes = [];
let currentChordLabel = '';
let transitioning = false;
let sessionStart = null; // set when listening begins
let currentSessionId = null;
let saveTimer = null;
let questionShownTime = 0; // timestamp when current question was displayed
let wakeLock = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (_) {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

// Re-acquire wake lock and refresh auth session when tab comes back to foreground
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (listening) requestWakeLock();
  if (db) db.auth.getSession(); // prompts token refresh if needed; onAuthStateChange handles the result
});

// ════════════════════════════════════════════════════════
// SVG LAYOUT CONSTANTS
// ════════════════════════════════════════════════════════
const LG      = 24;   // pixels between adjacent staff lines
const NR      = 11;   // note-head x-radius
const SW      = 2;    // staff line stroke width
const X1      = 72;   // staff left x
const X2      = 580;  // staff right x
const NX      = 350;  // note head x
const LEDPAD  = LG * 3.5; // padding above/below for ledger lines
const STAFFH  = 4 * LG;   // total height of one staff (top to bottom line)

// ════════════════════════════════════════════════════════
// NOTE TABLES
// sp = staff-position steps counted UP from the bottom staff line (sp=0).
// Even sp = line note; odd sp = space note.
// Staff lines: sp 0,2,4,6,8  |  Spaces: sp 1,3,5,7
// Treble clef: bottom line = E4, so sp 2 = G4 (G line), sp 6 = D5, etc.
// Bass clef:   bottom line = G2, so sp 4 = D3, sp 6 = F3 (F line), etc.
// ════════════════════════════════════════════════════════
const TREBLE_NATURALS = [
  { name:'C', octave:4, sp:-2 }, // middle C — ledger line below
  { name:'D', octave:4, sp:-1 },
  { name:'E', octave:4, sp: 0 }, // bottom line (E4)
  { name:'F', octave:4, sp: 1 },
  { name:'G', octave:4, sp: 2 }, // G line — treble clef curl
  { name:'A', octave:4, sp: 3 },
  { name:'B', octave:4, sp: 4 },
  { name:'C', octave:5, sp: 5 },
  { name:'D', octave:5, sp: 6 },
  { name:'E', octave:5, sp: 7 },
  { name:'F', octave:5, sp: 8 }, // top line (F5)
  { name:'G', octave:5, sp: 9 },
  { name:'A', octave:5, sp:10 },
  { name:'B', octave:5, sp:11 },
  { name:'C', octave:6, sp:12 }, // ledger line above
];

const BASS_NATURALS = [
  { name:'F', octave:2, sp:-1 }, // just below staff
  { name:'G', octave:2, sp: 0 }, // bottom line (G2)
  { name:'A', octave:2, sp: 1 },
  { name:'B', octave:2, sp: 2 },
  { name:'C', octave:3, sp: 3 },
  { name:'D', octave:3, sp: 4 },
  { name:'E', octave:3, sp: 5 },
  { name:'F', octave:3, sp: 6 }, // F line — bass clef dots straddle this
  { name:'G', octave:3, sp: 7 },
  { name:'A', octave:3, sp: 8 }, // top line (A3)
  { name:'B', octave:3, sp: 9 },
  { name:'C', octave:4, sp:10 }, // middle C — ledger line above
  { name:'D', octave:4, sp:11 },
  { name:'E', octave:4, sp:12 },
];

function expandWithSharps(list) {
  const noSharpAfter = new Set(['E','B']);
  const out = [];
  list.forEach((n, i) => {
    out.push(n);
    if (i < list.length - 1 && !noSharpAfter.has(n.name))
      out.push({ name: n.name + '#', octave: n.octave, sp: n.sp + 0.5 });
  });
  return out;
}

function getNoteList(clefType) {
  const base = clefType === 'treble' ? TREBLE_NATURALS : BASS_NATURALS;
  const pool = sharpsOn ? expandWithSharps(base) : base;
  return pool.filter(n => n.sp >= -2 && n.sp <= 12);
}

const SEMITONES = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function noteToMidi(name, octave) { return (SEMITONES[name] ?? 0) + octave * 12; }
function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function buildTriads(clef) {
  const list = getNoteList(clef).map(n => ({ ...n, clef }));
  const byMidi = new Map(list.map(n => [noteToMidi(n.name, n.octave), n]));
  const triads = [];
  for (const root of list) {
    const midi = noteToMidi(root.name, root.octave);
    const fifth    = byMidi.get(midi + 7);
    const majThird = byMidi.get(midi + 4);
    const minThird = byMidi.get(midi + 3);
    if (majThird && fifth) triads.push({ label: root.name + ' major', notes: [root, majThird, fifth] });
    if (minThird && fifth) triads.push({ label: root.name + ' minor', notes: [root, minThird, fifth] });
  }
  return triads;
}

function weightedPick(list, wt) {
  const weights = list.map(wt);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= weights[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

function pickNotes(prev = []) {
  currentChordLabel = '';
  const chosenClef = clefMode === 'both'
    ? (Math.random() < 0.5 ? 'treble' : 'bass') : clefMode;
  const list = getNoteList(chosenClef).map(n => ({ ...n, clef: chosenClef }));
  const wt = n => noteStats[`${n.clef}:${n.name}${n.octave}`] ?? SR_DEFAULT;
  const sameAsPrev = notes => prev.length === notes.length &&
    notes.every((n, i) => prev[i] && n.name === prev[i].name && n.octave === prev[i].octave && n.clef === prev[i].clef);
  if (numNotes === 1) {
    let pick, tries = 0;
    do { pick = weightedPick(list, wt); tries++; } while (sameAsPrev([pick]) && tries < 80);
    return [pick];
  }
  if (numNotes === 3) {
    const triads = buildTriads(chosenClef);
    if (!triads.length) return pickNotes(prev);
    const wt = t => noteStats[`${chosenClef}:${t.label}`] ?? SR_DEFAULT;
    let triad, tries = 0;
    do {
      triad = weightedPick(triads, wt);
      tries++;
    } while (sameAsPrev(triad.notes.sort((a, b) => a.sp - b.sp)) && tries < 80);
    currentChordLabel = triad.label;
    return triad.notes.sort((a, b) => a.sp - b.sp);
  }
  let a, b, tries = 0;
  do {
    a = weightedPick(list, wt);
    b = weightedPick(list, wt);
    tries++;
  } while ((a === b || Math.abs(a.sp - b.sp) < 2) && tries < 80);
  const result = [a, b].sort((x, y) => x.sp - y.sp);
  return sameAsPrev(result) ? pickNotes([]) : result;
}

// ════════════════════════════════════════════════════════
// SVG DRAWING
// ════════════════════════════════════════════════════════
const NS  = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('staff-svg');

function mk(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (text !== undefined) e.textContent = text;
  return e;
}

// staffTop = y-coord of the TOP staff line
function lineY(staffTop, idx) { return staffTop + idx * LG; } // idx 0=top, 4=bottom
function spToY(sp, staffTop)  { return staffTop + (8 - sp) * (LG / 2); }

function drawStaffLines(staffTop, x1, x2) {
  for (let i = 0; i < 5; i++) {
    const y = lineY(staffTop, i);
    svg.appendChild(mk('line', { x1, x2, y1:y, y2:y, stroke:'#d4cfc0', 'stroke-width':SW }));
  }
  svg.appendChild(mk('line', { x1, x2:x1, y1:lineY(staffTop,0), y2:lineY(staffTop,4), stroke:'#d4cfc0', 'stroke-width':SW }));
  svg.appendChild(mk('line', { x1:x2, x2, y1:lineY(staffTop,0), y2:lineY(staffTop,4), stroke:'#d4cfc0', 'stroke-width':SW }));
}

function drawTrebleClef(staffTop, x1) {
  const F = 5.5 * LG;
  const gLineY = spToY(2, staffTop);
  const baseline = gLineY + 0.27 * F;
  svg.appendChild(mk('text', {
    x: x1 + 2, y: baseline,
    'font-size': F, fill: '#c8a96e', 'font-family': 'serif',
  }, '𝄞'));
}

function drawBassClef(staffTop, x1) {
  const F = 2.8 * LG;
  const fLineY = spToY(6, staffTop);
  const baseline = fLineY + 0.52 * F;
  svg.appendChild(mk('text', {
    x: x1 + 4, y: baseline,
    'font-size': F, fill: '#c8a96e', 'font-family': 'serif',
  }, '𝄢'));
}

function drawNote(note, staffTop, nx) {
  const x = nx;
  const y = spToY(note.sp, staffTop);

  // Ledger lines below staff (sp < 0)
  if (note.sp < 0) {
    for (let s = 0; s >= Math.ceil(note.sp - 0.1); s -= 2) {
      const ly = spToY(s, staffTop);
      svg.appendChild(mk('line', { x1:x-20, x2:x+20, y1:ly, y2:ly, stroke:'#d4cfc0', 'stroke-width':SW }));
    }
  }
  // Ledger lines above staff (sp > 8)
  if (note.sp > 8) {
    for (let s = 10; s <= note.sp + 0.1; s += 2) {
      const ly = spToY(s, staffTop);
      svg.appendChild(mk('line', { x1:x-20, x2:x+20, y1:ly, y2:ly, stroke:'#d4cfc0', 'stroke-width':SW }));
    }
  }

  // Sharp symbol
  if (note.name.includes('#')) {
    svg.appendChild(mk('text', {
      x: x - 32, y: y + 7,
      'font-size': 26, fill: '#7eb8c8', 'font-family': 'serif'
    }, '♯'));
  }

  // Note head
  svg.appendChild(mk('ellipse', {
    cx: x, cy: y, rx: NR, ry: NR * 0.68,
    fill: '#e8e4d8', transform: `rotate(-12,${x},${y})`
  }));

  // Stem
  const stemDown = note.sp > 4;
  const sx = stemDown ? x - NR : x + NR;
  svg.appendChild(mk('line', {
    x1:sx, x2:sx, y1:y, y2: stemDown ? y + 52 : y - 52,
    stroke:'#e8e4d8', 'stroke-width':2.2
  }));
}

function redraw() {
  svg.innerHTML = '';
  const useBoth  = clefMode === 'both';
  const interGap = LG * 4;

  // On mobile use a narrower viewBox — halving it doubles the visual size.
  const isMobile = window.innerWidth <= 600;
  const VW  = isMobile ? 310 : (X2 + 20);
  const vX1 = isMobile ? 38  : X1;
  const vX2 = isMobile ? 295 : X2;
  const vNX = isMobile ? 180 : NX;

  let trebleTop, bassTop, totalH;
  if (useBoth) {
    trebleTop = LEDPAD;
    bassTop   = trebleTop + STAFFH + interGap;
    totalH    = bassTop + STAFFH + LEDPAD;
  } else {
    trebleTop = LEDPAD;
    totalH    = trebleTop + STAFFH + LEDPAD;
    bassTop   = trebleTop;
  }

  svg.setAttribute('viewBox', `0 0 ${VW} ${totalH}`);

  if (useBoth) {
    svg.appendChild(mk('line', {
      x1:vX1-4, x2:vX1-4,
      y1:lineY(trebleTop,0), y2:lineY(bassTop,4),
      stroke:'#d4cfc0', 'stroke-width':4
    }));
    drawStaffLines(trebleTop, vX1, vX2);
    drawTrebleClef(trebleTop, vX1);
    drawStaffLines(bassTop, vX1, vX2);
    drawBassClef(bassTop, vX1);
    currentNotes.forEach(n => drawNote(n, n.clef === 'treble' ? trebleTop : bassTop, vNX));
  } else {
    drawStaffLines(trebleTop, vX1, vX2);
    const noteClef = currentNotes.length ? currentNotes[0].clef : clefMode;
    if (noteClef === 'treble') drawTrebleClef(trebleTop, vX1);
    else drawBassClef(trebleTop, vX1);
    currentNotes.forEach(n => drawNote(n, trebleTop, vNX));
  }
}

// QUESTION FLOW
// ════════════════════════════════════════════════════════
function newQuestion() {
  transitioning = false;
  questionShownTime = Date.now();
  document.getElementById('hint-text').textContent = '';
  document.getElementById('note-display').textContent = '—';
  document.getElementById('note-display').className = 'note-name-display';
  currentNotes = pickNotes(currentNotes);
  redraw();
}

// ════════════════════════════════════════════════════════
// PITCH DETECTION
// ════════════════════════════════════════════════════════
function freqToNote(freq) {
  if (freq <= 0) return null;
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const semis  = 12 * Math.log2(freq / 440) + 9 + 48;
  const r = Math.round(semis);
  return { name: names[((r % 12) + 12) % 12], octave: Math.floor(r / 12) };
}

function autoCorrelate(buf, sr) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / SIZE) < 0.025) return -1;

  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE/2; i++) { if (Math.abs(buf[i]) < 0.2) { r1 = i; break; } }
  for (let i = 1; i < SIZE/2; i++) { if (Math.abs(buf[SIZE-i]) < 0.2) { r2 = SIZE-i; break; } }
  const sl = buf.slice(r1, r2), SZ = sl.length;
  const c = new Float32Array(SZ);
  for (let i = 0; i < SZ; i++) for (let j = 0; j < SZ-i; j++) c[i] += sl[j]*sl[j+i];

  let d = 0;
  while (c[d] > c[d+1]) d++;
  let maxVal = -1, maxPos = -1;
  for (let i = d; i < SZ; i++) if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; }

  let T0 = maxPos;
  const x1 = c[T0-1], x2 = c[T0], x3 = c[T0+1];
  const a = (x1+x3-2*x2)/2, b = (x3-x1)/2;
  if (a) T0 = T0 - b/(2*a);
  return sr / T0;
}

let pitchBuf = null, freqData = null, lastCorrectTime = 0;

// Returns an array of booleans — one per currentNote — indicating which
// are simultaneously present in the FFT spectrum right now.
function detectChord() {
  if (!freqData) freqData = new Float32Array(chordAnalyser.frequencyBinCount);
  chordAnalyser.getFloatFrequencyData(freqData);

  // Require the overall signal to be above the noise floor first.
  let peakDb = -Infinity;
  for (let i = 0; i < freqData.length; i++) if (freqData[i] > peakDb) peakDb = freqData[i];
  if (peakDb < -65) return currentNotes.map(() => false);

  const binHz = audioCtx.sampleRate / chordAnalyser.fftSize;
  // A note is present if energy within ±2 bins of its fundamental is within
  // 28 dB of the spectrum peak (handles varying mic gain levels).
  const threshold = peakDb - 28;
  return currentNotes.map(note => {
    const bin = Math.round(midiToFreq(noteToMidi(note.name, note.octave)) / binHz);
    let maxDb = -Infinity;
    for (let i = Math.max(0, bin - 2); i <= Math.min(freqData.length - 1, bin + 2); i++)
      maxDb = Math.max(maxDb, freqData[i]);
    return maxDb > threshold;
  });
}

function detectPitch() {
  if (!analyser || !listening) return;
  const pitchEl = document.getElementById('pitch-display');

  if (numNotes === 3 && chordAnalyser) {
    if (currentNotes.length) {
      const detected = detectChord();
      pitchEl.textContent = currentNotes
        .map((n, i) => (detected[i] ? '' : '[') + n.name + n.octave + (detected[i] ? '' : ']'))
        .join(' ');
      if (detected.every(Boolean) && !transitioning && Date.now() - lastCorrectTime >= 700)
        onCorrect();
    }
    rafId = requestAnimationFrame(detectPitch);
    return;
  }

  if (!pitchBuf) pitchBuf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(pitchBuf);
  const freq = autoCorrelate(pitchBuf, audioCtx.sampleRate);
  if (freq > 0) {
    const det = freqToNote(freq);
    pitchEl.textContent = `${det.name}${det.octave} · ${Math.round(freq)} Hz`;
    checkAnswer(det);
  } else {
    pitchEl.textContent = '—';
  }
  rafId = requestAnimationFrame(detectPitch);
}

function checkAnswer(det) {
  if (!currentNotes.length || transitioning) return;
  if (Date.now() - lastCorrectTime < 700) return;
  if (numNotes === 1) {
    const n = currentNotes[0];
    if (det.name === n.name && det.octave === n.octave) onCorrect();
  } else {
    const idx = currentNotes.findIndex(n => det.name === n.name && det.octave === n.octave);
    if (idx !== -1 && !currentNotes[idx]._matched) {
      currentNotes[idx]._matched = true;
      if (currentNotes.every(n => n._matched)) onCorrect();
    }
  }
}

function onCorrect() {
  lastCorrectTime = Date.now();
  transitioning = true;
  correctCount++; streak++; total++;
  updateScore();
  scheduleSave();
  if (questionShownTime > 0) {
    const ms = Math.min(Date.now() - questionShownTime, SR_MAX);
    if (currentChordLabel) {
      const key = `${currentNotes[0].clef}:${currentChordLabel}`;
      noteStats[key] = SR_ALPHA * ms + (1 - SR_ALPHA) * (noteStats[key] ?? SR_DEFAULT);
    } else {
      for (const n of currentNotes) {
        const key = `${n.clef}:${n.name}${n.octave}`;
        noteStats[key] = SR_ALPHA * ms + (1 - SR_ALPHA) * (noteStats[key] ?? SR_DEFAULT);
      }
    }
    saveNoteStats();
  }
  const label = currentChordLabel || currentNotes.map(n => n.name + n.octave).join(' + ');
  const el = document.getElementById('note-display');
  el.textContent = '✓ ' + label;
  el.className = 'note-name-display correct';
  setTimeout(newQuestion, 900);
}

function updateScore() {
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-streak').textContent  = streak;
  document.getElementById('score-total').textContent   = total;
}

// ════════════════════════════════════════════════════════
// SESSION HISTORY  (Supabase when signed in, localStorage otherwise)
// ════════════════════════════════════════════════════════
const HISTORY_KEY    = 'sightreader_history';
const NOTESTATS_KEY  = 'sightreader_notestats';
const SR_ALPHA       = 0.3;    // EMA smoothing — higher = faster adaptation
const SR_DEFAULT     = 4000;   // ms starting weight for never-seen notes
const SR_MAX         = 30000;  // cap response time to ignore walk-aways
let noteStats = {};
try { noteStats = JSON.parse(localStorage.getItem(NOTESTATS_KEY) || '{}'); } catch {}
let noteStatsDbTimer = null;

function saveNoteStats() {
  try { localStorage.setItem(NOTESTATS_KEY, JSON.stringify(noteStats)); } catch {}
  // Debounce the Supabase write — fires 3s after the last note
  if (db && currentUser) {
    clearTimeout(noteStatsDbTimer);
    noteStatsDbTimer = setTimeout(async () => {
      try {
        const upsert  = db.from('user_settings').upsert({ user_id: currentUser.id, note_stats: noteStats });
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000));
        await Promise.race([upsert, timeout]);
      } catch (e) { console.error('saveNoteStatsToDB:', e); }
    }, 3000);
  }
}

async function loadNoteStatsFromDB() {
  if (!db || !currentUser) return;
  try {
    const query   = db.from('user_settings').select('note_stats').eq('user_id', currentUser.id).single();
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000));
    const { data, error } = await Promise.race([query, timeout]);
    if (error || !data?.note_stats) return;
    // DB is source of truth; preserve any local-only keys not yet synced
    noteStats = { ...noteStats, ...data.note_stats };
    try { localStorage.setItem(NOTESTATS_KEY, JSON.stringify(noteStats)); } catch {}
  } catch (e) { console.error('loadNoteStatsFromDB:', e); }
}
let activeTab = 'daily';
let historyCache = []; // avoids repeated async reads within a single render cycle

function loadLocalHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

async function loadHistory() {
  if (db && currentUser) {
    const { data, error } = await db
      .from('sessions')
      .select('*')
      .order('ts', { ascending: false })
      .limit(200);
    if (error) { console.error('loadHistory:', error); return []; }
    return data ?? [];
  }
  return loadLocalHistory();
}

function showDbError(msg) {
  const el = document.getElementById('db-error');
  el.style.background = 'rgba(220,60,60,0.15)';
  el.style.borderColor = 'rgba(220,60,60,0.4)';
  el.style.color = '#e07070';
  el.textContent = 'Cloud save failed: ' + msg;
  el.style.display = 'block';
}

function showDbStatus(msg) {
  const el = document.getElementById('db-error');
  el.style.background = 'rgba(60,160,100,0.15)';
  el.style.borderColor = 'rgba(60,160,100,0.4)';
  el.style.color = '#6ec88a';
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveSession(), 1500);
}

function saveToLocalHistory(entry) {
  const history = loadLocalHistory();
  const idx = history.findIndex(s => s.id === currentSessionId);
  if (idx >= 0) history[idx] = entry; else history.unshift(entry);
  if (history.length > 200) history.length = 200;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

async function saveSession({ showStatus = false } = {}) {
  if (total === 0) return;
  const durationMs  = sessionStart ? Date.now() - sessionStart : 0;
  const durationMin = durationMs / 60000;
  const entry = {
    id:      currentSessionId,
    ts:      sessionStart,
    date:    new Date(sessionStart).toLocaleString(),
    day:     new Date(sessionStart).toLocaleDateString(),
    clef:    clefMode,
    notes:   numNotes,
    sharps:  sharpsOn,
    correct: correctCount,
    total:   total,
    pct:     Math.round(correctCount / total * 100),
    mins:    durationMin,
  };
  if (db && currentUser) {
    try {
      const upsert  = db.from('sessions').upsert({ ...entry, user_id: currentUser.id });
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('save timed out')), 8000));
      const { error } = await Promise.race([upsert, timeout]);
      if (error) throw new Error(error.message);
      if (showStatus) showDbStatus('Session saved to cloud ✓');
    } catch (e) {
      console.error('saveSession:', e);
      showDbError(e.message + ' — saved locally instead');
      saveToLocalHistory(entry);
    }
  } else {
    saveToLocalHistory(entry);
    if (showStatus) showDbStatus(db ? 'Saved locally (not signed in)' : 'Saved locally (no Supabase config)');
  }
}

// Called once when the user signs in: pushes any locally stored sessions
// into Supabase and clears localStorage on success.
async function mergeLocalHistory() {
  const local = loadLocalHistory();
  if (!local.length || !db || !currentUser) return;
  const toInsert = local.map(entry => ({
    ...entry,
    user_id: currentUser.id,
  }));
  const { error } = await db.from('sessions').upsert(toInsert);
  if (!error) {
    localStorage.removeItem(HISTORY_KEY);
  } else {
    console.error('mergeLocalHistory:', error);
  }
}


// Group sessions by calendar day, return array newest-first
function groupByDay(history) {
  const map = new Map();
  for (const s of history) {
    const key = s.day || new Date(s.ts || s.date).toLocaleDateString();
    if (!map.has(key)) map.set(key, { day: key, sessions: [] });
    map.get(key).sessions.push(s);
  }
  return [...map.values()].sort((a, b) => {
    return new Date(b.sessions[0].ts || b.day) - new Date(a.sessions[0].ts || a.day);
  });
}

function fmtMins(mins) {
  if (mins < 1) return `${Math.round(mins * 60)}s`;
  const m = Math.floor(mins);
  const s = Math.round((mins - m) * 60);
  return s > 0 ? `${m}m ${s}s` : `${m}m`;
}

function renderDailyView() {
  const el = document.getElementById('view-daily');
  const history = historyCache;
  if (!history.length) {
    el.innerHTML = '<div class="no-history">No sessions recorded yet.</div>';
    return;
  }
  const days = groupByDay(history);
  el.innerHTML = days.map(d => {
    const totalCorrect = d.sessions.reduce((s, x) => s + x.correct, 0);
    const totalMins    = d.sessions.reduce((s, x) => s + (x.mins || 0), 0);
    const speedNum     = totalMins > 0 ? totalCorrect / totalMins : null;

    // Per-mode breakdown
    const MODE_LABEL = { 1: '1 Note', 2: '2 Notes', 3: 'Triad' };
    const modes = [1, 2, 3].map(m => {
      const ss = d.sessions.filter(s => s.notes === m);
      if (!ss.length) return null;
      const correct = ss.reduce((a, s) => a + s.correct, 0);
      const mins    = ss.reduce((a, s) => a + (s.mins || 0), 0);
      return { label: MODE_LABEL[m], correct, mins };
    }).filter(Boolean);

    // Format day label: "Today", "Yesterday", or date string
    const now = new Date();
    const todayStr     = now.toLocaleDateString();
    const yesterdayStr = new Date(now - 86400000).toLocaleDateString();
    let dayLabel = d.day;
    if (d.day === todayStr)          dayLabel = `Today — ${d.day}`;
    else if (d.day === yesterdayStr) dayLabel = `Yesterday — ${d.day}`;

    const breakdownHtml = `
      <div class="mode-breakdown">
        <table class="history-table">
          <thead><tr><th>Mode</th><th>Correct</th><th>Time</th><th>Speed</th></tr></thead>
          <tbody>${modes.map(m => `
            <tr>
              <td>${m.label}</td>
              <td>${m.correct}</td>
              <td>${fmtMins(m.mins)}</td>
              <td>${m.mins > 0 ? (m.correct / m.mins).toFixed(1) + ' /min' : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

    const sessionRows = d.sessions.map(s => `
      <div class="session-row">
        <span>${new Date(s.ts || s.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
        <span style="text-transform:capitalize">${s.clef}${s.sharps ? ' ♯' : ''}</span>
        <span><span class="pill pill-good">${s.correct} correct</span></span>
        <span>${fmtMins(s.mins || 0)}</span>
        <span><span class="pill pill-blue">${s.mins > 0 ? (s.correct / s.mins).toFixed(1) : '—'} /min</span></span>
      </div>`).join('');

    return `
      <div class="day-block">
        <div class="day-header">${dayLabel}</div>
        <div class="day-stats">
          <div class="stat-cell">
            <div class="stat-label">Correct</div>
            <div class="stat-value green">${totalCorrect}</div>
            <div class="stat-sub">across ${d.sessions.length} session${d.sessions.length > 1 ? 's' : ''}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">Time Practiced</div>
            <div class="stat-value blue">${fmtMins(totalMins)}</div>
            <div class="stat-sub">total</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">Speed</div>
            <div class="stat-value gold">${speedNum !== null ? speedNum.toFixed(1) : '—'}</div>
            <div class="stat-sub">correct / min</div>
          </div>
        </div>
        ${breakdownHtml}
        <div class="session-rows">${sessionRows}</div>
      </div>`;
  }).join('');
}

function renderSessionLog() {
  const el = document.getElementById('view-sessions');
  const history = historyCache;
  if (!history.length) {
    el.innerHTML = '<div class="no-history">No sessions recorded yet.</div>';
    return;
  }
  const rows = history.map(s => `
    <tr>
      <td>${new Date(s.ts || s.date).toLocaleString()}</td>
      <td style="text-transform:capitalize">${s.clef}${s.sharps ? ' ♯' : ''}</td>
      <td>${s.notes === 3 ? 'Triad' : s.notes}</td>
      <td><span class="pill pill-good">${s.correct} / ${s.total}</span></td>
      <td><span class="pill pill-total">${s.pct}%</span></td>
      <td>${fmtMins(s.mins || 0)}</td>
      <td><span class="pill pill-blue">${s.mins > 0 ? (s.correct / s.mins).toFixed(1) : '—'} /min</span></td>
    </tr>`).join('');
  el.innerHTML = `
    <table class="history-table">
      <thead><tr>
        <th>Time</th><th>Clef</th><th>Notes</th><th>Score</th><th>Acc.</th><th>Duration</th><th>Speed</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderNoteStats() {
  const el = document.getElementById('view-notes');
  const entries = Object.entries(noteStats);
  if (!entries.length) {
    el.innerHTML = '<div class="no-history">No note data yet — complete some sessions to build stats.</div>';
    return;
  }
  const SEMI = { C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11 };
  const noteRows = [], chordRows = [];
  for (const [key, ema] of entries) {
    const [clef, rest] = key.split(/:(.+)/);
    if (rest.includes(' ')) {
      chordRows.push({ clef, label: rest, ema });
    } else {
      const octave = parseInt(rest.slice(-1));
      const name   = rest.slice(0, -1);
      const semi   = octave * 12 + (SEMI[name] ?? 0);
      noteRows.push({ clef, label: name + octave, semi, ema });
    }
  }
  noteRows.sort((a, b) => b.semi - a.semi || a.clef.localeCompare(b.clef));
  chordRows.sort((a, b) => a.label.localeCompare(b.label) || a.clef.localeCompare(b.clef));

  const fmtTime = ms => { const s = ms / 1000; return s < 10 ? s.toFixed(1) + 's' : Math.round(s) + 's'; };
  const pillClass = ms => ms < 2000 ? 'pill pill-good' : ms < 5000 ? 'pill pill-total' : 'pill pill-slow';
  const mkRow = r => `
        <tr>
          <td>${r.label}</td>
          <td style="text-transform:capitalize">${r.clef}</td>
          <td><span class="${pillClass(r.ema)}">${fmtTime(r.ema)}</span></td>
        </tr>`;

  el.innerHTML = `
    <table class="history-table">
      <thead><tr><th>Note / Chord</th><th>Clef</th><th>Avg Response</th></tr></thead>
      <tbody>${[...noteRows, ...chordRows].map(mkRow).join('')}
      </tbody>
    </table>`;
}

async function renderHistory() {
  historyCache = await loadHistory();
  renderDailyView();
  renderSessionLog();
  renderNoteStats();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('view-daily').style.display    = tab === 'daily'    ? '' : 'none';
  document.getElementById('view-sessions').style.display = tab === 'sessions' ? '' : 'none';
  document.getElementById('view-notes').style.display    = tab === 'notes'    ? '' : 'none';
}

// ════════════════════════════════════════════════════════
// MIC
// ════════════════════════════════════════════════════════
async function startListening() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micStream = stream;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const micSource = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    micSource.connect(analyser);
    chordAnalyser = audioCtx.createAnalyser();
    chordAnalyser.fftSize = 8192; // ~5.4 Hz/bin — resolves major vs minor thirds
    micSource.connect(chordAnalyser);
    listening       = true;
    correctCount = 0; streak = 0; total = 0;
    sessionStart    = Date.now();
    currentSessionId = crypto.randomUUID();
    updateScore();
    document.getElementById('mic-dot').classList.add('active');
    document.getElementById('mic-status').textContent = 'Listening';
    document.getElementById('start-btn').textContent  = 'Stop';
    newQuestion();
    detectPitch();
    requestWakeLock();
  } catch(e) {
    alert('Microphone access denied. Please allow mic access and reload.');
  }
}

function stopListening() {
  listening = false;
  releaseWakeLock();
  if (rafId) cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx)  audioCtx.close();
  pitchBuf = null; freqData = null; chordAnalyser = null;
  document.getElementById('mic-dot').classList.remove('active');
  document.getElementById('mic-status').textContent = 'Mic off';
  document.getElementById('start-btn').textContent  = 'Start Listening';
  document.getElementById('pitch-display').textContent = '—';
  clearTimeout(saveTimer);
  saveSession({ showStatus: true }).then(() => renderHistory());
}

// ════════════════════════════════════════════════════════
// CONTROLS
// ════════════════════════════════════════════════════════

document.getElementById('clef-select').addEventListener('change', e => { clefMode = e.target.value; newQuestion(); });
document.getElementById('notes-select').addEventListener('change', e => { numNotes = parseInt(e.target.value); newQuestion(); });
document.getElementById('sharps-select').addEventListener('change', e => { sharpsOn = e.target.value === 'on'; newQuestion(); });

document.getElementById('start-btn').addEventListener('click', () => {
  if (listening) stopListening(); else startListening();
});

document.getElementById('hint-btn').addEventListener('click', () => {
  const label = currentChordLabel || currentNotes.map(n => n.name + n.octave).join(' + ');
  document.getElementById('hint-text').textContent = label;
  streak = 0; total++;
  questionShownTime = 0; // hinted — don't record response time for this note
  updateScore();
  scheduleSave();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
newQuestion();

if (db) {
  // onAuthStateChange fires immediately with INITIAL_SESSION, so it handles
  // the first renderHistory() call as well as any subsequent sign-in/out.
  db.auth.onAuthStateChange(async (event, session) => {
    const prevUser = currentUser;
    currentUser = session?.user ?? null;

    // Load cloud data when a user session becomes available.
    // Wrapped in try/catch so that a network failure here never prevents
    // updateAuthUI() from running (which would leave the bar hidden).
    try {
      if (currentUser && currentUser.id !== prevUser?.id) {
        await loadNoteStatsFromDB();
        if (event === 'SIGNED_IN') await mergeLocalHistory();
      }
    } catch (e) {
      console.error('onAuthStateChange data load:', e);
    }

    updateAuthUI();
    renderNoteStats();
    try {
      await renderHistory();
    } catch (e) {
      console.error('onAuthStateChange renderHistory:', e);
    }
  });
} else {
  // Supabase not configured — run fully offline with localStorage.
  updateAuthUI();
  renderHistory();
}

// Redraw on resize/orientation change so mobile layout stays correct
window.addEventListener('resize', () => redraw());
</script>
